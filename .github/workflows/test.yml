name: Test this action 🧪
on:
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test this action 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo 🛎️
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Free Disk Space 🆓
        uses: ./
        with:
          tools-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true
